<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhotoCloud</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; max-width: 600px; margin-inline: auto; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
  header img { flex: none; }
  h1 { font-size: 2rem; margin: 0; }
  label, button, select { display: block; width: 100%; font-size: 1rem; margin: 8px 0; padding: 12px; box-sizing: border-box; }
  button { display: flex; align-items: center; justify-content: center; gap: 12px; border: 2px solid #c79a00; border-radius: 12px; background: #ffd914; color: #4a3000; font-weight: 600; }
  button svg { width: 56px; height: 56px; flex: none; }
  button:active:not(:disabled) { background: #f2c800; }
  button.secondary { background: #fff3a8; border-color: #e0c040; }
  button:disabled { opacity: .5; }
  select { border: 2px solid #e0c040; border-radius: 12px; background: #fffbe0; color: #4a3000; }
  ul { list-style: none; padding: 0; }
  li { padding: 8px 0; border-bottom: 1px solid #ddd; word-break: break-all; }
  progress { width: 100%; }
  .ok { color: #188038; } .err { color: #d93025; }
</style>
</head>
<body>
<header><img src="/favicon.png" alt="" width="96" height="96"><h1>PhotoCloud</h1></header>
<label for="folder">Zielordner</label>
<select id="folder"></select>
<input id="picker" type="file" multiple accept="image/*,{{ACCEPT}}" hidden>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="banana" d="M10 6 C2 28 12 45 30 44 C42 43 47 30 47 17 C43 30 34 27 27 27 C20 27 17 20 17 6 Z" fill="#ffd914" stroke="#7a4b10" stroke-width="2" stroke-linejoin="round"/>
  </defs>
</svg>
<button id="pick" type="button">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="31" fill="#fffbe0"/>
    <g transform="translate(6 -2) rotate(-18 28 28) scale(.9)"><use href="#banana"/></g>
    <g fill="#f2b98f" stroke="#7a4b10" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <rect x="18" y="39" width="30" height="20" rx="8"/>
      <rect x="20" y="30" width="9" height="16" rx="4.5"/>
      <rect x="29" y="28" width="9" height="18" rx="4.5"/>
      <rect x="38" y="30" width="9" height="16" rx="4.5"/>
      <path d="M18 46 C12 44 10 38 14 36 C17 35 19 38 20 41"/>
    </g>
  </svg>
  Bilder auswählen
</button>
<button id="upload" type="button" disabled>
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="31" fill="#fffbe0"/>
    <g transform="translate(9 -4) rotate(-35 28 22) scale(.85)"><use href="#banana"/></g>
    <g fill="none" stroke="#7a4b10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 54 L22 46 M32 58 L32 48 M42 54 L42 46"/>
      <path d="M32 44 L32 38 M28 41 L32 37 L36 41"/>
    </g>
  </svg>
  Hochladen
</button>
<button id="reset" type="button" class="secondary">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="31" fill="#fffbe0"/>
    <path d="M6 58 H58" stroke="#7a4b10" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(-4 33) scale(1.25 .45)"><use href="#banana"/></g>
    <g fill="#ffd914" stroke="#7a4b10" stroke-width="1.6">
      <ellipse cx="7" cy="52" rx="3.5" ry="2.5"/><ellipse cx="57" cy="52" rx="3.5" ry="2.5"/>
      <circle cx="12" cy="44" r="2.2"/><circle cx="52" cy="44" r="2.2"/>
    </g>
    <g fill="#f2b98f" stroke="#7a4b10" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <rect x="16" y="4" width="32" height="14" rx="6"/>
      <rect x="17" y="15" width="9" height="16" rx="4.5"/>
      <rect x="27" y="15" width="9" height="18" rx="4.5"/>
      <rect x="37" y="15" width="9" height="16" rx="4.5"/>
    </g>
    <g fill="none" stroke="#7a4b10" stroke-width="2.5" stroke-linecap="round">
      <path d="M10 36 L4 32 M54 36 L60 32 M12 41 L5 42 M52 41 L59 42"/>
    </g>
  </svg>
  Neu beginnen
</button><p id="summary"></p>
<ul id="list"></ul>
<script>
const MAX_BYTES = {{MAXMB}} * 1024 * 1024;
const $ = id => document.getElementById(id);
let items = [];
let busy = false;

fetch('/api/folders').then(r => r.json()).then(folders => {
  $('folder').innerHTML = folders.map(f => `<option>${f.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</option>`).join('');
});

function render() {
  $('list').innerHTML = '';
  for (const it of items) {
    const li = document.createElement('li');
    const status = it.state === 'done' ? '<span class="ok">✔ hochgeladen</span>'
      : it.state === 'error' ? `<span class="err">✖ ${it.error}</span>`
      : it.state === 'uploading' ? '<progress max="100" value="' + it.percent + '"></progress>' : 'wartet';
    li.append(it.file.name + ' ');
    li.insertAdjacentHTML('beforeend', status);
    $('list').append(li);
  }
  $('upload').disabled = busy || !items.some(i => i.state === 'pending');
  $('summary').textContent = items.length ? `${items.length} Datei(en) ausgewählt` : '';
}

$('pick').onclick = () => $('picker').click();
$('picker').onchange = () => {
  for (const file of $('picker').files) {
    items.push(file.size > MAX_BYTES
      ? { file, state: 'error', error: 'zu groß' }
      : { file, state: 'pending', percent: 0 });
  }
  $('picker').value = '';
  render();
};
$('reset').onclick = () => { if (!busy) { items = []; render(); } };

function send(it) {
  return new Promise(resolve => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload?folder=' + encodeURIComponent($('folder').value) + '&lastModified=' + it.file.lastModified);
    xhr.upload.onprogress = e => { if (e.lengthComputable) { it.percent = e.loaded * 100 / e.total; render(); } };
    xhr.onload = () => {
      try {
        const r = JSON.parse(xhr.responseText);
        const f = r.files && r.files[0];
        if (f && f.ok) it.state = 'done'; else { it.state = 'error'; it.error = (f && f.error) || r.error || 'Fehler'; }
      } catch { it.state = 'error'; it.error = 'Fehler ' + xhr.status; }
      resolve();
    };
    xhr.onerror = () => { it.state = 'error'; it.error = 'Server nicht erreichbar'; resolve(); };
    const form = new FormData();
    form.append('file', it.file, it.file.name);
    it.state = 'uploading'; it.percent = 0; render();
    xhr.send(form);
  });
}

$('upload').onclick = async () => {
  busy = true; $('folder').disabled = true; render();
  for (const it of items.filter(i => i.state === 'pending')) await send(it);
  busy = false; $('folder').disabled = false; render();
};
render();
</script>
</body>
</html>
